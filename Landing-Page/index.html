
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="thermometer">🌡️</div>
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures quickly and easily.</p>

        <form id="converterForm">
            <label for="temperature">Enter temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="e.g. 25"
                step="any"
                required
            >

            <label for="fromUnit">Convert from</label>
            <select id="fromUnit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <label for="toUnit">Convert to</label>
            <select id="toUnit">
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Convert Temperature</button>
        </form>

        <section id="result" class="result" aria-live="polite">
            Your result will appear here.
        </section>

        <p class="footer">Built with HTML, CSS &amp; JavaScript</p>
    </main>
</body>
</html>
